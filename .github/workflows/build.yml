name: build

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armv7l, x86_64, x86]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm yasm
          sudo pip3 install meson --break-system-packages || sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build
        run: |
          buildscripts/include/ci.sh build

      - name: Upload APK and Native Binaries
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-${{ matrix.arch }}
          path: |
            app/build/outputs/apk/**/*.apk
            buildscripts/prefix/**/lib/libmpv.so
            app/src/main/libs/**/*.so

  package-universal-aar:
    name: Package Universal AAR
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Download all architecture artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts

      - name: Assemble Universal AAR
        run: |
          mkdir -p staging/jni/arm64-v8a staging/jni/armeabi-v7a staging/jni/x86_64 staging/jni/x86 staging/assets
          
          # Copy native .so libraries for all 4 architectures
          cp -r all-artifacts/mpv-android-arm64/app/src/main/libs/arm64-v8a/* staging/jni/arm64-v8a/
          cp -r all-artifacts/mpv-android-armv7l/app/src/main/libs/armeabi-v7a/* staging/jni/armeabi-v7a/
          cp -r all-artifacts/mpv-android-x86_64/app/src/main/libs/x86_64/* staging/jni/x86_64/
          cp -r all-artifacts/mpv-android-x86/app/src/main/libs/x86/* staging/jni/x86/
          
          # Assets
          [ -f app/src/main/assets/cacert.pem ] && cp app/src/main/assets/cacert.pem staging/assets/
          [ -f app/src/main/assets/subfont.ttf ] && cp app/src/main/assets/subfont.ttf staging/assets/
          
          # Compile Java/Kotlin classes
          export ANDROID_HOME=/usr/local/lib/android/sdk
          chmod +x ./gradlew
          ./gradlew compileDefaultReleaseKotlin || ./gradlew compileDefaultDebugKotlin
          
          mkdir -p /tmp/classes
          find app/build -name "*.class" -exec cp --parents {} /tmp/classes/ \; || true
          
          # Create classes.jar
          cd app/build/tmp/kotlin-classes/* || cd app/build/intermediates/javac/*
          jar -cf "$GITHUB_WORKSPACE/staging/classes.jar" .
          cd "$GITHUB_WORKSPACE"
          
          # Manifest & R.txt
          cat << 'EOF' > staging/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="is.xyz.mpv">
          </manifest>
          EOF
          touch staging/R.txt
          
          # Zip into universal AAR
          cd staging
          zip -r ../mpv-android-nuvio.aar .
          cd "$GITHUB_WORKSPACE"

      - name: Upload Universal AAR
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-nuvio-universal-aar
          path: mpv-android-nuvio.aar
